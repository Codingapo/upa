<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#070a12">
  <meta name="color-scheme" content="dark">
  <meta name="description" content="SupaPlay brings anime, movies and TV shows together in one seamless catalogue.">
  <meta name="robots" content="index,follow,max-image-preview:large">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="SupaPlay">
  <meta property="og:title" content="SupaPlay — Anime, Movies & TV">
  <meta property="og:description" content="Discover anime, movies and TV shows in one seamless catalogue.">
  <meta property="og:url" content="https://legal.supaplay.fun/">
  <link rel="canonical" href="https://legal.supaplay.fun/">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/assets/icons/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/assets/css/app.css">
  <title>SupaPlay — Anime, Movies & TV</title>
</head>
<body>
  <a class="skip-link" href="#main-content">Skip to content</a>

  <header class="site-header" id="site-header">
    <div class="header-inner shell">
      <a class="brand" href="/" data-link aria-label="SupaPlay home">
        <span class="brand-mark" aria-hidden="true">S</span>
        <span class="brand-word">SUPA<span>PLAY</span></span>
      </a>

      <nav class="desktop-nav" aria-label="Primary navigation">
        <a href="/" data-link data-nav="home">Home</a>
        <a href="/browse/movie" data-link data-nav="movie">Movies</a>
        <a href="/browse/tv" data-link data-nav="tv">TV Shows</a>
        <a href="/browse/anime" data-link data-nav="anime">Anime</a>
        <button class="nav-button" type="button" data-open-genres>Genres</button>
      </nav>

      <div class="header-actions">
        <form class="header-search" id="header-search" role="search">
          <svg aria-hidden="true" viewBox="0 0 24 24"><path d="m21 21-4.35-4.35m2.35-5.65a8 8 0 1 1-16 0 8 8 0 0 1 16 0Z"/></svg>
          <input id="header-search-input" type="search" name="q" autocomplete="off" placeholder="Search SupaPlay" aria-label="Search SupaPlay">
        </form>
        <a class="icon-button desktop-only" href="/watchlist" data-link aria-label="My list" title="My list">
          <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M6 3h12a1 1 0 0 1 1 1v17l-7-4-7 4V4a1 1 0 0 1 1-1Z"/></svg>
        </a>
      </div>
    </div>
  </header>

  <main id="main-content" tabindex="-1"></main>

  <footer class="site-footer">
    <div class="shell footer-grid">
      <div>
        <a class="brand footer-brand" href="/" data-link>
          <span class="brand-mark" aria-hidden="true">S</span>
          <span class="brand-word">SUPA<span>PLAY</span></span>
        </a>
        <p>Anime, movies and TV shows together in one clean experience.</p>
      </div>
      <div class="footer-links">
        <a href="/browse/movie" data-link>Movies</a>
        <a href="/browse/tv" data-link>TV Shows</a>
        <a href="/browse/anime" data-link>Anime</a>
        <a href="/watchlist" data-link>My List</a>
      </div>
      <p class="footer-note">SupaPlay indexes metadata supplied by its configured APIs.</p>
    </div>
  </footer>

  <nav class="mobile-nav" aria-label="Mobile navigation">
    <a href="/" data-link data-nav="home">
      <svg aria-hidden="true" viewBox="0 0 24 24"><path d="m3 11 9-8 9 8v10h-6v-6H9v6H3V11Z"/></svg>
      <span>Home</span>
    </a>
    <a href="/browse/movie" data-link data-nav="movie">
      <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M4 5h16v14H4V5Zm0 4h16M8 5l3 4m3-4 3 4"/></svg>
      <span>Movies</span>
    </a>
    <a href="/search" data-link data-nav="search">
      <svg aria-hidden="true" viewBox="0 0 24 24"><path d="m21 21-4.35-4.35m2.35-5.65a8 8 0 1 1-16 0 8 8 0 0 1 16 0Z"/></svg>
      <span>Search</span>
    </a>
    <a href="/browse/anime" data-link data-nav="anime">
      <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M12 3 3 8l9 5 9-5-9-5Zm-9 9 9 5 9-5m-18 4 9 5 9-5"/></svg>
      <span>Anime</span>
    </a>
    <a href="/watchlist" data-link data-nav="watchlist">
      <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M6 3h12a1 1 0 0 1 1 1v17l-7-4-7 4V4a1 1 0 0 1 1-1Z"/></svg>
      <span>My List</span>
    </a>
  </nav>

  <div class="drawer-backdrop" id="drawer-backdrop" hidden></div>
  <aside class="genre-drawer" id="genre-drawer" aria-label="Browse genres" aria-hidden="true">
    <div class="drawer-head">
      <div><span class="eyebrow">Explore</span><h2>Genres</h2></div>
      <button class="icon-button" type="button" data-close-genres aria-label="Close genres">
        <svg aria-hidden="true" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></svg>
      </button>
    </div>
    <div class="genre-list" id="genre-list"></div>
  </aside>

  <div class="toast-region" id="toast-region" aria-live="polite" aria-atomic="true"></div>

  <template id="card-skeleton-template">
    <article class="media-card skeleton-card" aria-hidden="true">
      <div class="skeleton poster-skeleton"></div>
      <div class="skeleton line-skeleton"></div>
      <div class="skeleton line-skeleton short"></div>
    </article>
  </template>

  <script>
    window.SUPAPLAY_CONFIG = {
      siteName: "SupaPlay",
      siteUrl: "https://legal.supaplay.fun",
      unifiedApiBase: "/api",
      animeApiBase: "https://api.animapo.fun/api",
      movieApiBase: "https://movie.supaplay.fun",
      moviePlayerApiBase: "https://movie.supaplay.fun",
      defaultPerPage: 24
    };
  </script>
  <script type="module" src="/assets/js/app.js"></script>
</body>
</html>
